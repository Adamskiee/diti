name: diti_notifications
description: Local notifications scheduling adapter and background lifecycle handler for Diti.
version: 2.3.0
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  timer_engine:
    path: ../timer_engine
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  diti_database:
    path: ../diti_database
  drift: ^2.20.0
