name: Setup Flutter
description: Set up Java (optional) and Flutter stable, then resolve dependencies for root and all local packages.
inputs:
  java:
    description: Install Java 17 (needed for Android builds/tests)
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up Java
      if: inputs.java == 'true'
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Cache Pub Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.pub-cache/hosted
          ~/.pub-cache/git
        key: pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          pub-cache-${{ runner.os }}-

    - name: Install Dependencies
      shell: bash
      run: |
        echo "Resolving root dependencies..."
        flutter pub get
        echo "Activating Melos CLI globally..."
        dart pub global activate melos 6.3.2
        PUB_BIN_DIR="${PUB_CACHE:-$HOME/.pub-cache}/bin"
        echo "$PUB_BIN_DIR" >> "$GITHUB_PATH"
        export PATH="$PUB_BIN_DIR:$PATH"
        echo "Bootstrapping Melos workspace..."
        melos bootstrap
