name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: read

jobs:
  verify:
    name: Pre-Release Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Analyze
        run: dart run melos run analyze

      - name: Test
        run: dart run melos run test:fast

  verify-e2e-android:
    name: Pre-Release E2E Tests (Android)
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PATROL_CLI_VERSION: '4.8.0'
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m' -Dorg.gradle.workers.max=2"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free Runner Disk Space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/android/sdk/system-images/*
          sudo docker system prune --all --volumes --force 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          echo "Disk space after cleanup:"
          df -h

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli "$PATROL_CLI_VERSION"

      - name: Run Patrol and integration_test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          ram-size: 2048M
          disk-size: 2048M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: |
            adb wait-for-device
            adb devices -l
            flutter devices
            patrol test --target patrol_test/notification_permission_test.dart --no-check-compatibility --show-flutter-logs --verbose
            flutter test integration_test -d emulator-5554

      - name: Upload Android Test Results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-android-test-results
          path: |
            build/app/outputs/androidTest-results/
            build/app/reports/androidTests/
          retention-days: 7
          if-no-files-found: ignore

  build-android:
    name: Build Android Artifacts
    needs: [verify, verify-e2e-android]
    runs-on: ubuntu-latest
    outputs:
      has_supply_key: ${{ steps.check_supply.outputs.has_supply_key }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Check Play Store Supply Secret
        id: check_supply
        env:
          SUPPLY_JSON_KEY: ${{ secrets.SUPPLY_JSON_KEY }}
        run: |
          if [ -n "$SUPPLY_JSON_KEY" ]; then
            echo "has_supply_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_supply_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Android NDK
        run: |
          # shellcheck disable=SC2012,SC2086
          if [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            echo "Using ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
            echo "ANDROID_NDK_VERSION=$(basename "$ANDROID_NDK_HOME")" >> $GITHUB_ENV
          elif [ -n "$ANDROID_NDK" ] && [ -d "$ANDROID_NDK" ]; then
            echo "Using ANDROID_NDK: $ANDROID_NDK"
            echo "ANDROID_NDK_VERSION=$(basename "$ANDROID_NDK")" >> $GITHUB_ENV
          elif [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            INSTALLED_NDK=$(ls -1 "$ANDROID_SDK_ROOT/ndk" 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$INSTALLED_NDK" ]; then
              echo "Found preinstalled Android NDK: $INSTALLED_NDK"
              echo "ANDROID_NDK_VERSION=$INSTALLED_NDK" >> $GITHUB_ENV
            fi
          fi

      - name: Configure Keystore Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Configuring release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            STORE_PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            KEY_PASS="$KEY_PASSWORD"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret provided. Generating fallback release signing keystore..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias diti-release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass diti-release-pass \
              -keypass diti-release-pass \
              -dname "CN=Diti Release, O=AdiLabs, C=US"
            STORE_PASS="diti-release-pass"
            ALIAS="diti-release"
            KEY_PASS="diti-release-pass"
          fi

          cat <<EOF > android/key.properties
          storeFile=app/release.keystore
          storePassword=$STORE_PASS
          keyAlias=$ALIAS
          keyPassword=$KEY_PASS
          EOF

          {
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Install FastForge CLI
        run: |
          dart pub global activate fastforge
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Build Android Packages via FastForge
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          mkdir -p build/symbols
          fastforge release --name release --jobs android-universal-apk
          fastforge release --name release --jobs android-split-apk --skip-clean
          fastforge release --name release --jobs android-aab --skip-clean

      - name: Upload Debug Symbols
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-symbols
          path: build/symbols
          retention-days: 7
          if-no-files-found: ignore

      - name: Stage Android Release Assets
        id: stage
        env:
          TAG_INPUT: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p staging/android
          RAW_TAG="$TAG_INPUT"
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG="$REF_NAME"
          fi
          # If empty, or contains '/', or does not start with 'v' followed by a digit, fallback to pubspec version:
          if [ -z "$RAW_TAG" ] || [ "$RAW_TAG" = "main" ] || [[ "$RAW_TAG" == *"/"* ]] || [[ ! "$RAW_TAG" =~ ^v[0-9] ]]; then
            RAW_TAG="v$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}' | cut -d'+' -f1 | tr -d '\r')"
          fi

          echo "Using tag prefix: $RAW_TAG"

          cp build/app/outputs/flutter-apk/app-release.apk "staging/android/diti-${RAW_TAG}-android-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "staging/android/diti-${RAW_TAG}-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "staging/android/diti-${RAW_TAG}-android-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "staging/android/diti-${RAW_TAG}-android-x86_64.apk"
          cp build/app/outputs/bundle/release/app-release.aab "staging/android/diti-${RAW_TAG}-android.aab"

          ls -la staging/android/

      - name: Upload Android Assets
        uses: actions/upload-artifact@v7
        with:
          name: android-release-assets
          path: staging/android/*
          retention-days: 1

  security:
    name: Release Security Gate
    needs: [build-android]
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      mode: release
      apk-artifact: android-release-assets

  build-linux:
    name: Build Linux Desktop Artifacts
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev wget file
          # Install AppImageTool for FastForge AppImage maker (extracted to bypass FUSE in CI)
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          (cd /tmp && ./appimagetool --appimage-extract)
          sudo mv /tmp/squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          java: 'false'

      - name: Install FastForge CLI
        run: |
          dart pub global activate fastforge
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Configure FastForge AppImage Packaging
        run: |
          mkdir -p linux/packaging/appimage
          cat << 'EOF' > linux/packaging/appimage/make_config.yaml
          display_name: Diti
          icon: assets/diti-256.png
          metainfo: packaging/linux/com.adilabs.diti.metainfo.xml
          categories:
            - Utility
            - Clock
            - ProjectManagement
          keywords:
            - timer
            - routine
            - productivity
          EOF

      - name: Build Linux Packages via FastForge
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fastforge release --name release --jobs linux-tar,linux-appimage

      - name: Stage Linux Release Assets
        env:
          TAG_INPUT: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p staging/linux
          RAW_TAG="$TAG_INPUT"
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG="$REF_NAME"
          fi
          # If empty, or contains '/', or does not start with 'v' followed by a digit, fallback to pubspec version:
          if [ -z "$RAW_TAG" ] || [ "$RAW_TAG" = "main" ] || [[ "$RAW_TAG" == *"/"* ]] || [[ ! "$RAW_TAG" =~ ^v[0-9] ]]; then
            RAW_TAG="v$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}' | cut -d'+' -f1 | tr -d '\r')"
          fi

          echo "Using tag prefix: $RAW_TAG"

          # 1. Stage AppImage built by FastForge
          APPIMAGE_FILE=$(find dist -name "*.AppImage" -o -name "*.appimage" 2>/dev/null | head -n 1)
          if [ -n "$APPIMAGE_FILE" ] && [ -f "$APPIMAGE_FILE" ]; then
            cp "$APPIMAGE_FILE" "staging/linux/diti-${RAW_TAG}-linux-x86_64.AppImage"
          else
            echo "::error::FastForge failed to produce Linux AppImage in dist/"
            exit 1
          fi

          # 2. Stage compressed tarball bundle
          TAR_DIR="diti-${RAW_TAG}-linux-x64"
          mkdir -p "staging/$TAR_DIR"
          cp -r build/linux/x64/release/bundle/* "staging/$TAR_DIR/"
          (cd "staging/$TAR_DIR" && ln -sf diti focus_flow && ln -sf diti aditime)
          tar -czf "staging/linux/diti-${RAW_TAG}-linux-x86_64.tar.gz" -C staging "$TAR_DIR"
          rm -rf "staging/$TAR_DIR"

          ls -la staging/linux/

      - name: Upload Linux Assets
        uses: actions/upload-artifact@v7
        with:
          name: linux-release-assets
          path: staging/linux/*
          retention-days: 1

  build-flatpak:
    name: Build Flatpak Bundle
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Linux Build Dependencies and Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev flatpak flatpak-builder elfutils

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          java: 'false'

      - name: Build Linux Bundle
        run: flutter build linux --release

      - name: Install Freedesktop 24.08 Runtime and SDK
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Build Flatpak Bundle
        env:
          TAG_INPUT: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p staging/flatpak
          RAW_TAG="$TAG_INPUT"
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG="$REF_NAME"
          fi
          # If empty, or contains '/', or does not start with 'v' followed by a digit, fallback to pubspec version:
          if [ -z "$RAW_TAG" ] || [ "$RAW_TAG" = "main" ] || [[ "$RAW_TAG" == *"/"* ]] || [[ ! "$RAW_TAG" =~ ^v[0-9] ]]; then
            RAW_TAG="v$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}' | cut -d'+' -f1 | tr -d '\r')"
          fi

          echo "Using tag prefix: $RAW_TAG"

          flatpak-builder --force-clean --repo=repo build-dir packaging/linux/com.adilabs.diti.yml
          flatpak build-bundle repo "staging/flatpak/diti-${RAW_TAG}-linux-x86_64.flatpak" com.adilabs.diti

          ls -la staging/flatpak/

      - name: Upload Flatpak Assets
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-release-assets
          path: staging/flatpak/*
          retention-days: 1

  publish-playstore:
    name: Publish to Google Play Store
    needs: [build-android]
    if: needs.build-android.outputs.has_supply_key == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download Android Artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-release-assets
          path: staging/android

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Bundler and Fastlane
        run: |
          cd android
          gem install bundler
          bundle install

      - name: Configure Fastlane Service Account
        env:
          SUPPLY_JSON_KEY: ${{ secrets.SUPPLY_JSON_KEY }}
        run: |
          mkdir -p android/fastlane
          echo "$SUPPLY_JSON_KEY" > android/fastlane/service-account.json
          cp android/fastlane/service-account.json android/service-account.json
          echo "SUPPLY_JSON_KEY_FILE=$GITHUB_WORKSPACE/android/fastlane/service-account.json" >> "$GITHUB_ENV"

      - name: Deploy to Google Play Internal Track
        run: |
          cd android
          AAB_FILE=$(find ../staging/android -name "*.aab" | head -n 1)
          mkdir -p ../dist
          cp "$AAB_FILE" ../dist/diti.aab
          bundle exec fastlane distribute_internal aab:"$AAB_FILE"

  publish-release:
    name: Publish GitHub Release
    needs: [verify, build-android, build-linux, build-flatpak, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Determine Release Tag
        id: tag_info
        env:
          TAG_INPUT: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          RAW_TAG="$TAG_INPUT"
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG="$REF_NAME"
          fi
          # If empty, or contains '/', or does not start with 'v' followed by a digit, fallback to pubspec version:
          if [ -z "$RAW_TAG" ] || [ "$RAW_TAG" = "main" ] || [[ "$RAW_TAG" == *"/"* ]] || [[ ! "$RAW_TAG" =~ ^v[0-9] ]]; then
            RAW_TAG="v$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}' | cut -d'+' -f1 | tr -d '\r')"
          fi

          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"

          # Detect prerelease (contains -alpha, -beta, -rc)
          if echo "$RAW_TAG" | grep -Eq -- '-(alpha|beta|rc)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Android Assets
        uses: actions/download-artifact@v8
        with:
          name: android-release-assets
          path: dist

      - name: Download Linux Assets
        uses: actions/download-artifact@v8
        with:
          name: linux-release-assets
          path: dist

      - name: Download Flatpak Assets
        uses: actions/download-artifact@v8
        with:
          name: flatpak-release-assets
          path: dist

      - name: Compute SHA-256 Checksums
        run: |
          cd dist
          # shellcheck disable=SC2035
          sha256sum * > checksums.txt
          echo "Generated Checksums:"
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Diti ${{ steps.tag_info.outputs.tag }}
          draft: false
          prerelease: ${{ steps.tag_info.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/*
