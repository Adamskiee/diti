name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: ''

jobs:
  verify:
    name: Pre-Release Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: |
          for pkg in packages/*; do
            if [ -d "$pkg/test" ]; then
              (cd "$pkg" && flutter test)
            fi
          done
          flutter test test/

  verify-e2e-android:
    name: Pre-Release E2E Tests (Android)
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PATROL_CLI_VERSION: '4.8.0'
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m' -Dorg.gradle.workers.max=2"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free Runner Disk Space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/android/sdk/system-images/*
          sudo docker system prune --all --volumes --force 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          echo "Disk space after cleanup:"
          df -h

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli "$PATROL_CLI_VERSION"

      - name: Run Patrol and integration_test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          ram-size: 2048M
          disk-size: 2048M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: |
            adb wait-for-device
            adb devices -l
            flutter devices
            patrol test --target patrol_test/notification_permission_test.dart --no-check-compatibility --show-flutter-logs --verbose
            flutter test integration_test -d emulator-5554

      - name: Upload Android Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-android-test-results
          path: |
            build/app/outputs/androidTest-results/
            build/app/reports/androidTests/
          retention-days: 7
          if-no-files-found: ignore

  build-android:
    name: Build Android Artifacts
    needs: [verify, verify-e2e-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Configure Android NDK
        run: |
          if [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            echo "Using ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
            echo "ANDROID_NDK_VERSION=$(basename "$ANDROID_NDK_HOME")" >> $GITHUB_ENV
          elif [ -n "$ANDROID_NDK" ] && [ -d "$ANDROID_NDK" ]; then
            echo "Using ANDROID_NDK: $ANDROID_NDK"
            echo "ANDROID_NDK_VERSION=$(basename "$ANDROID_NDK")" >> $GITHUB_ENV
          elif [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            INSTALLED_NDK=$(ls -1 "$ANDROID_SDK_ROOT/ndk" 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$INSTALLED_NDK" ]; then
              echo "Found preinstalled Android NDK: $INSTALLED_NDK"
              echo "ANDROID_NDK_VERSION=$INSTALLED_NDK" >> $GITHUB_ENV
            fi
          fi

      - name: Configure Keystore Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Configuring release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            cat <<EOF > android/key.properties
          storeFile=app/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          else
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing! Production release builds must be signed."
            exit 1
          fi

      - name: Build Universal APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Build Split per-ABI APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-symbols
          path: build/symbols
          retention-days: 7

      - name: Stage Android Release Assets
        id: stage
        env:
          TAG_INPUT: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p staging/android
          RAW_TAG="$TAG_INPUT"
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG="$REF_NAME"
          fi
          # If empty, or contains '/', or does not start with 'v' followed by a digit, fallback to pubspec version:
          if [ -z "$RAW_TAG" ] || [ "$RAW_TAG" = "main" ] || [[ "$RAW_TAG" == *"/"* ]] || [[ ! "$RAW_TAG" =~ ^v[0-9] ]]; then
            RAW_TAG="v$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}' | tr -d '\r')"
          fi

          echo "Using tag prefix: $RAW_TAG"

          cp build/app/outputs/flutter-apk/app-release.apk "staging/android/diti-${RAW_TAG}-android-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "staging/android/diti-${RAW_TAG}-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "staging/android/diti-${RAW_TAG}-android-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "staging/android/diti-${RAW_TAG}-android-x86_64.apk"
          cp build/app/outputs/bundle/release/app-release.aab "staging/android/diti-${RAW_TAG}-android.aab"

          ls -la staging/android/

      - name: Upload Android Assets
        uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: staging/android/*
          retention-days: 1

  build-linux:
    name: Build Linux Desktop Artifacts
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev wget file

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          java: 'false'

      - name: Build Linux Bundle
        run: flutter build linux --release

      - name: Stage Tarball and Build AppImage
        env:
          TAG_INPUT: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p staging/linux
          RAW_TAG="$TAG_INPUT"
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG="$REF_NAME"
          fi
          # If empty, or contains '/', or does not start with 'v' followed by a digit, fallback to pubspec version:
          if [ -z "$RAW_TAG" ] || [ "$RAW_TAG" = "main" ] || [[ "$RAW_TAG" == *"/"* ]] || [[ ! "$RAW_TAG" =~ ^v[0-9] ]]; then
            RAW_TAG="v$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}' | tr -d '\r')"
          fi

          echo "Using tag prefix: $RAW_TAG"

          # 1. Package compressed tarball bundle
          TAR_DIR="diti-${RAW_TAG}-linux-x64"
          mkdir -p "staging/$TAR_DIR"
          cp -r build/linux/x64/release/bundle/* "staging/$TAR_DIR/"
          (cd "staging/$TAR_DIR" && ln -sf diti focus_flow && ln -sf diti aditime)
          tar -czf "staging/linux/diti-${RAW_TAG}-linux-x86_64.tar.gz" -C staging "$TAR_DIR"
          rm -rf "staging/$TAR_DIR"

          # 2. Package AppImage using extracted appimagetool (bypasses FUSE in CI)
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract

          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r build/linux/x64/release/bundle/lib/* AppDir/usr/lib/ || true
          cp -r build/linux/x64/release/bundle/data AppDir/usr/bin/
          cp build/linux/x64/release/bundle/diti AppDir/usr/bin/

          # Create AppRun entrypoint
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/diti" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Create desktop entry
          cat << 'EOF' > AppDir/diti.desktop
          [Desktop Entry]
          Name=Diti
          Comment=Cross-platform daily planning and multi-phase routine timer.
          Exec=diti
          Icon=diti
          Type=Application
          Categories=Utility;Clock;
          Terminal=false
          StartupWMClass=com.adilabs.diti
          EOF
          mkdir -p AppDir/usr/share/applications
          cp AppDir/diti.desktop AppDir/usr/share/applications/diti.desktop

          # Copy icon
          cp assets/diti-256.png AppDir/diti.png
          cp AppDir/diti.png AppDir/usr/share/icons/hicolor/256x256/apps/diti.png

          ARCH=x86_64 ./squashfs-root/AppRun AppDir "staging/linux/diti-${RAW_TAG}-linux-x86_64.AppImage"

          ls -la staging/linux/

      - name: Upload Linux Assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: staging/linux/*
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [verify, build-android, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: tag_info
        env:
          TAG_INPUT: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          RAW_TAG="$TAG_INPUT"
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG="$REF_NAME"
          fi
          # If empty, or contains '/', or does not start with 'v' followed by a digit, fallback to pubspec version:
          if [ -z "$RAW_TAG" ] || [ "$RAW_TAG" = "main" ] || [[ "$RAW_TAG" == *"/"* ]] || [[ ! "$RAW_TAG" =~ ^v[0-9] ]]; then
            RAW_TAG="v$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}' | tr -d '\r')"
          fi

          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"

          # Detect prerelease (contains -alpha, -beta, -rc)
          if echo "$RAW_TAG" | grep -Eq -- '-(alpha|beta|rc)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Android Assets
        uses: actions/download-artifact@v4
        with:
          name: android-release-assets
          path: dist

      - name: Download Linux Assets
        uses: actions/download-artifact@v4
        with:
          name: linux-release-assets
          path: dist

      - name: Compute SHA-256 Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          echo "Generated Checksums:"
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Diti ${{ steps.tag_info.outputs.tag }}
          draft: false
          prerelease: ${{ steps.tag_info.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/*
