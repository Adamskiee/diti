name: "Lint PR"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  validate-pr:
    name: Validate PR Title & Format
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Validate PR Title Length
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          LENGTH=${#PR_TITLE}
          echo "PR Title: $PR_TITLE"
          echo "Title length: $LENGTH characters"
          if [ "$LENGTH" -gt 72 ]; then
            echo "::error::PR title exceeds 72 characters ($LENGTH chars). Titles must be strictly under 72 characters per repository PR guidelines."
            exit 1
          fi

      - name: Validate Conventional Commit Title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            app
            core
            repo
            routines
            plan
            timer
            history
            settings
            database
            notifications
            tracker
            timer_engine
            ci
            deps
            docs
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: "The commit subject must not start with an uppercase character."
