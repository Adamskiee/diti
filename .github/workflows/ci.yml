name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PATROL_CLI_VERSION: '4.8.0'

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Static Analysis & Linter
        run: flutter analyze --fatal-infos

      - name: Run Package Tests
        run: |
          for pkg in packages/*; do
            if [ -d "$pkg/test" ]; then
              echo "Running tests in $pkg..."
              (cd "$pkg" && flutter test)
            fi
          done

      - name: Run Root Tests (unit, widget, golden)
        run: flutter test test/ --coverage

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Golden Failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          retention-days: 7
          if-no-files-found: ignore

  integration-linux:
    name: Integration Tests (Linux)
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev xvfb

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          java: 'false'

      - name: Run integration_test on Linux
        run: xvfb-run -a flutter test integration_test -d linux

  integration-android:
    name: Integration & Patrol Tests (Android)
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m' -Dorg.gradle.workers.max=2"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free Runner Disk Space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/android/sdk/system-images/*
          sudo docker system prune --all --volumes --force 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          echo "Disk space after cleanup:"
          df -h

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli "$PATROL_CLI_VERSION"

      - name: Run Patrol and integration_test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          ram-size: 2048M
          disk-size: 2048M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: |
            adb wait-for-device
            adb devices -l
            flutter devices
            patrol test --target patrol_test/notification_permission_test.dart --no-check-compatibility --show-flutter-logs --verbose
            flutter test integration_test -d android

      - name: Upload Android Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            build/app/outputs/androidTest-results/
            build/app/reports/androidTests/
          retention-days: 7
          if-no-files-found: ignore
