version: 2
updates:
  # Root Flutter application dependencies
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        dependency-type: "production"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      dev-dependencies:
        dependency-type: "development"
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # Internal subpackages
  - package-ecosystem: "pub"
    directory: "/packages/diti_database"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 3

  - package-ecosystem: "pub"
    directory: "/packages/diti_notifications"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 3

  - package-ecosystem: "pub"
    directory: "/packages/diti_tracker"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 3

  - package-ecosystem: "pub"
    directory: "/packages/timer_engine"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 3

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
