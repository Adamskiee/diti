name: diti
description: Diti - Cross-platform daily planning and multi-phase routine timer.
publish_to: none
version: 2.3.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  timer_engine:
    path: packages/timer_engine
  diti_database:
    path: packages/diti_database
  diti_notifications:
    path: packages/diti_notifications
  diti_tracker:
    path: packages/diti_tracker
  uuid: ^4.5.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  path: ^1.9.1
  timezone: ^0.9.4
  flutter_local_notifications: ^18.0.1
  drift: ^2.20.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  alchemist: ^0.14.1
  integration_test:
    sdk: flutter
  patrol: ^4.10.0
  melos: ^6.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/

patrol:
  app_name: Diti
  test_directory: patrol_test
  android:
    package_name: com.adilabs.diti.debug

